name: Redot Rust compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  engine-profiles:
    runs-on: ubuntu-24.04
    outputs:
      profiles: ${{ steps.lock.outputs.profiles }}
      rust: ${{ steps.lock.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lock
        run: |
          python3 - <<'PY'
          import json
          import os
          from tools.redot_api import load_lock
          lock = load_lock()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("profiles=" + json.dumps(list(lock["certified_engines"])) + "\n")
              output.write("rust=" + lock["binding_abi"]["rust"]["cargo_version"] + "\n")
          PY

  windows-x86-64:
    needs: engine-profiles
    strategy:
      fail-fast: false
      matrix:
        engine_profile: ${{ fromJSON(needs.engine-profiles.outputs.profiles) }}
    env:
      RUST_VERSION: ${{ needs.engine-profiles.outputs.rust }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the locked Rust toolchain
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install "$env:RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$env:RUST_VERSION"
          cargo fetch --locked

      - name: Download locked binding and runtime editors
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/fetch_engine.py --binding --target windows-x86_64 --output-dir build/redot --github-env $env:GITHUB_ENV
          python tools/fetch_engine.py --engine-profile "${{ matrix.engine_profile }}" --target windows-x86_64 --output-dir build/redot --github-env $env:GITHUB_ENV

      - name: Reproduce independent binding and engine API identities
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/dump_redot_api.py --redot-bin $env:BINDING_REDOT_BIN --binding --output-dir build/api
          python tools/dump_redot_api.py --redot-bin $env:REDOT_BIN --engine-profile "${{ matrix.engine_profile }}" --output-dir build/engine-api

      - name: Unit, format, lint, and Rust tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m unittest discover -s tests -p "test_*.py"
          python tools/configure_cargo.py --api build/api/extension_api.json -- cargo fmt --all -- --check
          python tools/configure_cargo.py --api build/api/extension_api.json -- cargo clippy --workspace --all-targets --all-features -- -D warnings
          python tools/configure_cargo.py --api build/api/extension_api.json -- cargo test --workspace --all-features

      - name: Build, audit, and stage both profiles
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/configure_cargo.py --api build/api/extension_api.json -- cargo build --workspace
          python tools/configure_cargo.py --api build/api/extension_api.json -- cargo build --workspace --release
          python tools/stage_extension.py --target windows-x86_64 --target-dir target --project-dir fixtures/redot-project
          python tools/verify_binary_deps.py target/debug/redot_rust_smoke.dll --target windows-x86_64 --exact-exports --architecture x86_64 --report reports/ci/windows/${{ matrix.engine_profile }}/debug-binary.json
          python tools/verify_binary_deps.py target/release/redot_rust_smoke.dll --target windows-x86_64 --exact-exports --architecture x86_64 --report reports/ci/windows/${{ matrix.engine_profile }}/release-binary.json

      - name: Run editor and runtime fixtures
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/materialize_fixture.py --source-project fixtures/redot-project --output-project build/fixture-debug --target windows-x86_64 --profile debug
          python tools/materialize_fixture.py --source-project fixtures/redot-project --output-project build/fixture-release --target windows-x86_64 --profile release
          python tools/run_fixture.py build/fixture-debug --redot-bin $env:REDOT_BIN --report-dir reports/ci/windows/${{ matrix.engine_profile }}/debug --engine-profile "${{ matrix.engine_profile }}"
          python tools/run_fixture.py build/fixture-release --redot-bin $env:REDOT_BIN --report-dir reports/ci/windows/${{ matrix.engine_profile }}/release --engine-profile "${{ matrix.engine_profile }}"

      - name: Package and verify clean installs
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/package_release.py --api build/api/extension_api.json --target windows-x86_64 --debug-binary target/debug/redot_rust_smoke.dll --release-binary target/release/redot_rust_smoke.dll --output-dir dist
          $package = (Get-ChildItem dist -Filter "*windows-x86_64.zip" | Select-Object -First 1).FullName
          python tools/prepare_clean_install.py --source-project tests/clean-install-fixture --output-project build/clean-debug --package $package --target windows-x86_64 --profile debug --report reports/ci/windows/${{ matrix.engine_profile }}/clean-debug-install.json
          python tools/prepare_clean_install.py --source-project tests/clean-install-fixture --output-project build/clean-release --package $package --target windows-x86_64 --profile release --report reports/ci/windows/${{ matrix.engine_profile }}/clean-release-install.json
          python tools/run_fixture.py build/clean-debug --initialize-only --redot-bin $env:REDOT_BIN --report-dir reports/ci/windows/${{ matrix.engine_profile }}/clean-debug-import --engine-profile "${{ matrix.engine_profile }}"
          python tools/run_installed_fixture.py --project build/clean-debug --target windows-x86_64 --redot-bin $env:REDOT_BIN --report-dir reports/ci/windows/${{ matrix.engine_profile }}/clean-debug --engine-profile "${{ matrix.engine_profile }}" --skip-initialize --import-report reports/ci/windows/${{ matrix.engine_profile }}/clean-debug-import/run-report.json
          python tools/run_fixture.py build/clean-release --initialize-only --redot-bin $env:REDOT_BIN --report-dir reports/ci/windows/${{ matrix.engine_profile }}/clean-release-import --engine-profile "${{ matrix.engine_profile }}"
          python tools/run_installed_fixture.py --project build/clean-release --target windows-x86_64 --redot-bin $env:REDOT_BIN --report-dir reports/ci/windows/${{ matrix.engine_profile }}/clean-release --engine-profile "${{ matrix.engine_profile }}" --skip-initialize --import-report reports/ci/windows/${{ matrix.engine_profile }}/clean-release-import/run-report.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-${{ matrix.engine_profile }}-evidence
          path: |
            reports/ci/windows/${{ matrix.engine_profile }}
            dist/*windows-x86_64*
          retention-days: 7

  linux-x86-64:
    needs: engine-profiles
    strategy:
      fail-fast: false
      matrix:
        engine_profile: ${{ fromJSON(needs.engine-profiles.outputs.profiles) }}
    env:
      RUST_VERSION: ${{ needs.engine-profiles.outputs.rust }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
          cargo fetch --locked

      - name: Download locked binding and runtime editors
        run: |
          python3 tools/fetch_engine.py --binding --target linux-x86_64 --output-dir build/redot --github-env "$GITHUB_ENV"
          python3 tools/fetch_engine.py --engine-profile "${{ matrix.engine_profile }}" --target linux-x86_64 --output-dir build/redot --github-env "$GITHUB_ENV"

      - name: Reproduce independent binding and engine API identities
        run: |
          python3 tools/dump_redot_api.py --redot-bin "$BINDING_REDOT_BIN" --binding --output-dir build/api
          python3 tools/dump_redot_api.py --redot-bin "$REDOT_BIN" --engine-profile "${{ matrix.engine_profile }}" --output-dir build/engine-api

      - name: Build, test, audit, and stage both profiles
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/configure_cargo.py --api build/api/extension_api.json -- cargo fmt --all -- --check
          python3 tools/configure_cargo.py --api build/api/extension_api.json -- cargo clippy --workspace --all-targets --all-features -- -D warnings
          python3 tools/configure_cargo.py --api build/api/extension_api.json -- cargo test --workspace --all-features
          python3 tools/configure_cargo.py --api build/api/extension_api.json -- cargo build --workspace
          python3 tools/configure_cargo.py --api build/api/extension_api.json -- cargo build --workspace --release
          python3 tools/stage_extension.py --target linux-x86_64 --target-dir target --project-dir fixtures/redot-project
          python3 tools/verify_binary_deps.py target/debug/libredot_rust_smoke.so --target linux-x86_64 --exact-exports --architecture x86_64 --report reports/ci/linux/${{ matrix.engine_profile }}/debug-binary.json
          python3 tools/verify_binary_deps.py target/release/libredot_rust_smoke.so --target linux-x86_64 --exact-exports --architecture x86_64 --report reports/ci/linux/${{ matrix.engine_profile }}/release-binary.json

      - name: Run editor and runtime fixtures
        run: |
          python3 tools/materialize_fixture.py --source-project fixtures/redot-project --output-project build/fixture-debug --target linux-x86_64 --profile debug
          python3 tools/materialize_fixture.py --source-project fixtures/redot-project --output-project build/fixture-release --target linux-x86_64 --profile release
          python3 tools/run_fixture.py build/fixture-debug --redot-bin "$REDOT_BIN" --report-dir reports/ci/linux/${{ matrix.engine_profile }}/debug --engine-profile "${{ matrix.engine_profile }}"
          python3 tools/run_fixture.py build/fixture-release --redot-bin "$REDOT_BIN" --report-dir reports/ci/linux/${{ matrix.engine_profile }}/release --engine-profile "${{ matrix.engine_profile }}"

      - name: Package and verify clean installs
        run: |
          python3 tools/package_release.py --api build/api/extension_api.json --target linux-x86_64 --debug-binary target/debug/libredot_rust_smoke.so --release-binary target/release/libredot_rust_smoke.so --output-dir dist
          package="$(find dist -maxdepth 1 -type f -name '*linux-x86_64.zip' -print -quit)"
          python3 tools/prepare_clean_install.py --source-project tests/clean-install-fixture --output-project build/clean-debug --package "$package" --target linux-x86_64 --profile debug --report reports/ci/linux/${{ matrix.engine_profile }}/clean-debug-install.json
          python3 tools/prepare_clean_install.py --source-project tests/clean-install-fixture --output-project build/clean-release --package "$package" --target linux-x86_64 --profile release --report reports/ci/linux/${{ matrix.engine_profile }}/clean-release-install.json
          python3 tools/run_fixture.py build/clean-debug --initialize-only --redot-bin "$REDOT_BIN" --report-dir reports/ci/linux/${{ matrix.engine_profile }}/clean-debug-import --engine-profile "${{ matrix.engine_profile }}"
          python3 tools/run_installed_fixture.py --project build/clean-debug --target linux-x86_64 --redot-bin "$REDOT_BIN" --report-dir reports/ci/linux/${{ matrix.engine_profile }}/clean-debug --engine-profile "${{ matrix.engine_profile }}" --skip-initialize --import-report reports/ci/linux/${{ matrix.engine_profile }}/clean-debug-import/run-report.json
          python3 tools/run_fixture.py build/clean-release --initialize-only --redot-bin "$REDOT_BIN" --report-dir reports/ci/linux/${{ matrix.engine_profile }}/clean-release-import --engine-profile "${{ matrix.engine_profile }}"
          python3 tools/run_installed_fixture.py --project build/clean-release --target linux-x86_64 --redot-bin "$REDOT_BIN" --report-dir reports/ci/linux/${{ matrix.engine_profile }}/clean-release --engine-profile "${{ matrix.engine_profile }}" --skip-initialize --import-report reports/ci/linux/${{ matrix.engine_profile }}/clean-release-import/run-report.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-${{ matrix.engine_profile }}-evidence
          path: |
            reports/ci/linux/${{ matrix.engine_profile }}
            dist/*linux-x86_64*
          retention-days: 7

  macos-universal:
    needs: engine-profiles
    strategy:
      fail-fast: false
      matrix:
        engine_profile: ${{ fromJSON(needs.engine-profiles.outputs.profiles) }}
    env:
      RUST_VERSION: ${{ needs.engine-profiles.outputs.rust }}
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo fetch --locked

      - name: Download locked binding and runtime editors
        run: |
          python3 tools/fetch_engine.py --binding --target macos-universal --output-dir build/redot --github-env "$GITHUB_ENV"
          python3 tools/fetch_engine.py --engine-profile "${{ matrix.engine_profile }}" --target macos-universal --output-dir build/redot --github-env "$GITHUB_ENV"

      - name: Reproduce independent binding and engine API identities
        run: |
          python3 tools/dump_redot_api.py --redot-bin "$BINDING_REDOT_BIN" --binding --output-dir build/api
          python3 tools/dump_redot_api.py --redot-bin "$REDOT_BIN" --engine-profile "${{ matrix.engine_profile }}" --output-dir build/engine-api

      - name: Unit, format, lint, and Rust tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/configure_cargo.py --api build/api/extension_api.json -- cargo fmt --all -- --check
          python3 tools/configure_cargo.py --api build/api/extension_api.json -- cargo clippy --workspace --all-targets --all-features -- -D warnings
          python3 tools/configure_cargo.py --api build/api/extension_api.json -- cargo test --workspace --all-features

      - name: Build both architectures and create universal libraries
        run: |
          python3 tools/configure_cargo.py --api build/api/extension_api.json -- cargo build --workspace --target aarch64-apple-darwin
          python3 tools/configure_cargo.py --api build/api/extension_api.json -- cargo build --workspace --target x86_64-apple-darwin
          python3 tools/configure_cargo.py --api build/api/extension_api.json -- cargo build --workspace --release --target aarch64-apple-darwin
          python3 tools/configure_cargo.py --api build/api/extension_api.json -- cargo build --workspace --release --target x86_64-apple-darwin
          mkdir -p build/macos-universal/debug build/macos-universal/release
          lipo -create target/aarch64-apple-darwin/debug/libredot_rust_smoke.dylib target/x86_64-apple-darwin/debug/libredot_rust_smoke.dylib -output build/macos-universal/debug/libredot_rust_smoke.dylib
          lipo -create target/aarch64-apple-darwin/release/libredot_rust_smoke.dylib target/x86_64-apple-darwin/release/libredot_rust_smoke.dylib -output build/macos-universal/release/libredot_rust_smoke.dylib
          python3 tools/stage_extension.py --target macos-universal --debug-binary build/macos-universal/debug/libredot_rust_smoke.dylib --release-binary build/macos-universal/release/libredot_rust_smoke.dylib --project-dir fixtures/redot-project
          python3 tools/verify_binary_deps.py build/macos-universal/debug/libredot_rust_smoke.dylib --target macos-universal --exact-exports --architecture arm64 --architecture x86_64 --report reports/ci/macos/${{ matrix.engine_profile }}/debug-binary.json
          python3 tools/verify_binary_deps.py build/macos-universal/release/libredot_rust_smoke.dylib --target macos-universal --exact-exports --architecture arm64 --architecture x86_64 --report reports/ci/macos/${{ matrix.engine_profile }}/release-binary.json

      - name: Run native editor and runtime fixtures
        run: |
          python3 tools/materialize_fixture.py --source-project fixtures/redot-project --output-project build/fixture-debug --target macos-universal --profile debug
          python3 tools/materialize_fixture.py --source-project fixtures/redot-project --output-project build/fixture-release --target macos-universal --profile release
          python3 tools/run_fixture.py build/fixture-debug --redot-bin "$REDOT_BIN" --report-dir reports/ci/macos/${{ matrix.engine_profile }}/debug --engine-profile "${{ matrix.engine_profile }}"
          python3 tools/run_fixture.py build/fixture-release --redot-bin "$REDOT_BIN" --report-dir reports/ci/macos/${{ matrix.engine_profile }}/release --engine-profile "${{ matrix.engine_profile }}"

      - name: Package and verify clean installs
        run: |
          python3 tools/package_release.py --api build/api/extension_api.json --target macos-universal --debug-binary build/macos-universal/debug/libredot_rust_smoke.dylib --release-binary build/macos-universal/release/libredot_rust_smoke.dylib --output-dir dist
          package="$(find dist -maxdepth 1 -type f -name '*macos-universal.zip' -print -quit)"
          python3 tools/prepare_clean_install.py --source-project tests/clean-install-fixture --output-project build/clean-debug --package "$package" --target macos-universal --profile debug --report reports/ci/macos/${{ matrix.engine_profile }}/clean-debug-install.json
          python3 tools/prepare_clean_install.py --source-project tests/clean-install-fixture --output-project build/clean-release --package "$package" --target macos-universal --profile release --report reports/ci/macos/${{ matrix.engine_profile }}/clean-release-install.json
          python3 tools/run_fixture.py build/clean-debug --initialize-only --redot-bin "$REDOT_BIN" --report-dir reports/ci/macos/${{ matrix.engine_profile }}/clean-debug-import --engine-profile "${{ matrix.engine_profile }}"
          python3 tools/run_installed_fixture.py --project build/clean-debug --target macos-universal --redot-bin "$REDOT_BIN" --report-dir reports/ci/macos/${{ matrix.engine_profile }}/clean-debug --engine-profile "${{ matrix.engine_profile }}" --skip-initialize --import-report reports/ci/macos/${{ matrix.engine_profile }}/clean-debug-import/run-report.json
          python3 tools/run_fixture.py build/clean-release --initialize-only --redot-bin "$REDOT_BIN" --report-dir reports/ci/macos/${{ matrix.engine_profile }}/clean-release-import --engine-profile "${{ matrix.engine_profile }}"
          python3 tools/run_installed_fixture.py --project build/clean-release --target macos-universal --redot-bin "$REDOT_BIN" --report-dir reports/ci/macos/${{ matrix.engine_profile }}/clean-release --engine-profile "${{ matrix.engine_profile }}" --skip-initialize --import-report reports/ci/macos/${{ matrix.engine_profile }}/clean-release-import/run-report.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-${{ matrix.engine_profile }}-evidence
          path: |
            reports/ci/macos/${{ matrix.engine_profile }}
            dist/*macos-universal*
          retention-days: 7
